name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tzdata
      - run: python -m unittest discover -s tests -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Check the QML loads from source
        run: python -m claude_pulse --selftest
      - run: pyinstaller --noconfirm claude-pulse.spec
      - name: Check the QML loads from the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ClaudePulse.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePulse
          path: dist/ClaudePulse.exe
      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/ClaudePulse.exe --clobber
          else
            gh release create "${{ github.ref_name }}" dist/ClaudePulse.exe --latest=false --generate-notes --title "Claude Pulse for Windows ${{ github.ref_name }}"
          fi
