name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tzdata
      - run: python -m unittest discover -s tests -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Check the QML loads from source
        run: python -m claude_pulse --selftest
      - run: pyinstaller --noconfirm claude-pulse.spec
      - name: Check the QML loads from the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ClaudePulse.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePulse
          path: dist/ClaudePulse.exe
      - name: Publish the release
        # Every successful build of the windows branch (or a v* tag) updates the release
        # for the version in claude_pulse/__init__.py.
        if: github.ref == 'refs/heads/windows' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import claude_pulse; print(claude_pulse.__version__)")
          tag="v${version}-windows"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ClaudePulse.exe --clobber
          else
            gh release create "$tag" dist/ClaudePulse.exe --target "$GITHUB_SHA" --latest=false \
              --title "Claude Pulse for Windows $version" \
              --notes "Windows tray version of Claude Pulse. Download ClaudePulse.exe and run it. Source and README: https://github.com/${GITHUB_REPOSITORY}/tree/windows. The exe is not code-signed, so SmartScreen may warn on first start: More info → Run anyway."
          fi
